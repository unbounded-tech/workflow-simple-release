name: On Push to Main, Version and Tag For Release
on:
  push:
    branches:
    - main

permissions:
  packages: write
  contents: write

jobs:

  version-and-tag:
    name: Version and Tag
    uses: unbounded-tech/workflow-vnext-tag/.github/workflows/workflow.yaml@57940706ad2325bd4f1fe50bb91880b643e9afae # v1.21.3
    secrets: inherit
    with:
      useDeployKey: true